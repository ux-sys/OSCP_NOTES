[libdefaults]
    default_realm = KITSUNE.LOCAL
    dns_lookup_kdc = false
    dns_lookup_realm = false
    kdc_timesync = 1
    ccache_type = 4
    forwardable = true
    proxiable = true
    rdns = false

[realms]
    KITSUNE.LOCAL = {
        kdc = 10.1.152.66
        admin_server = 10.1.152.66
    }

[domain_realm]
    .kitsune\.local = KITSUNE.LOCAL
    kitsune.local = KITSUNE.LOCAL
